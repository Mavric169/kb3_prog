<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Header Navigation Example</title>
        <style>
        /* Reset some default styles */
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
            }
        /* Style the navigation bar */
            nav {
                background-color: #f8f9fa;
                padding: 10px 20px;
                border-bottom: 1px solid #ccc;
            }
        /* Style the list inside nav to be horizontal */
            nav ul {
                list-style: none;
                margin: 0;
                padding: 0;
                display: flex;
            }
        /* Style each item */
            nav ul li {
                margin-right: 20px;
            }
        /* Style the links */
            nav ul li a {
                text-decoration: none;
                color: #333;
                font-weight: bold;
            }
        /* Optional: hover effect for links */
            nav ul li a:hover {
                color: #007bff;
        }
        </style>
    </head>
    <body>
        <!-- Navigation Header -->
    <nav>
        <ul>
            <li><a href="#">Article</a></li>
            <li><a href="#">Talk</a></li>
            <li><a href="#">Read</a></li>
            <li><a href="#">Edit</a></li>
            <li><a href="#">View history</a></li>
        </ul>
    </nav>
        <!-- Your page content -->
        <div style="padding:20px;">
            <h1>Welcome to My Site</h1>
            <p>This is an example page with a header navigation similar to Wikipedia.</p>
        </div>
    </body>
</html>
